name: Deploy Frontend to VM

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout frontend repository
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Angular
      - name: Build Angular
        run: npm run build

      # Backup current frontend
      - name: Backup current frontend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            if [ -d "/var/www/html/chess_" ]; then
              echo "Removing previous backup..."
              sudo rm -rf "/var/www/html/chess_"
            fi

            if [ -d "/var/www/html/chess" ]; then
              echo "Backing up current frontend..."
              sudo mv "/var/www/html/chess" "/var/www/html/chess_"
            fi

            sudo mkdir -p "/var/www/html/chess"

      # Copy new Angular build
      - name: Deploy frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "dist/chess-analyzer-frontend/browser/*"
          target: "/var/www/html/chess"
          rm: true

      - name: Deployment completed
        run: echo "Frontend VM deployment completed successfully."